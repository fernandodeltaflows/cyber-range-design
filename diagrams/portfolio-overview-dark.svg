  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#8b949e">Crisis tabletops, red vs blue exercises, SOC assessments and two training ranges</text>
  <rect x="30.0" y="90" width="125.6" height="112" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="92.8" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3">Crisis Tabletops</text>
  <text x="92.8" y="142" text-anchor="middle" font-size="10.5" fill="#8b949e">3 exercises · 3 days</text>
  <line x1="50.0" y1="156" x2="135.6" y2="156" stroke="#6e7681" stroke-width="1" opacity="0.5"/>
  <text x="92.8" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">Lead the response</text>
  <rect x="173.6" y="90" width="125.6" height="112" rx="6" fill="#1e1830" stroke="#a371f7" stroke-width="1.5"/>
  <text x="236.4" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3">Red vs Blue</text>
  <text x="236.4" y="142" text-anchor="middle" font-size="10.5" fill="#8b949e">3 exercises · CTF</text>
  <line x1="193.6" y1="156" x2="279.2" y2="156" stroke="#a371f7" stroke-width="1" opacity="0.5"/>
  <text x="236.4" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#a371f7">Attack, then defend</text>
  <rect x="317.2" y="90" width="125.6" height="112" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380.0" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3">SOC Assessment</text>
  <text x="380.0" y="142" text-anchor="middle" font-size="10.5" fill="#8b949e">3 tiers · ranked</text>
  <line x1="337.2" y1="156" x2="422.79999999999995" y2="156" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
  <text x="380.0" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Measure the analyst</text>
  <rect x="460.8" y="90" width="125.6" height="112" rx="6" fill="#2b1d12" stroke="#d29922" stroke-width="1.5"/>
  <text x="523.6" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3">Adversary Emulation</text>
  <text x="523.6" y="142" text-anchor="middle" font-size="10.5" fill="#8b949e">67 missions</text>
  <line x1="480.8" y1="156" x2="566.4" y2="156" stroke="#d29922" stroke-width="1" opacity="0.5"/>
  <text x="523.6" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922">Perform the intrusion</text>
  <rect x="604.4" y="90" width="125.6" height="112" rx="6" fill="#14202e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="667.2" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3">DFIR and Detection</text>
  <text x="667.2" y="142" text-anchor="middle" font-size="10.5" fill="#8b949e">60 missions</text>
  <line x1="624.4" y1="156" x2="710.0" y2="156" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <text x="667.2" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Find the evidence</text>
  <rect x="30" y="228" width="700" height="66" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6edf3">The same person designed all five</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#8b949e">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
  <rect x="30" y="312" width="700" height="86" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
