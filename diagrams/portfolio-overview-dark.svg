  <text x="380" y="376" text-anchor="middle" font-size="11.5" fill="#8b949e">MITRE ATT&amp;CK and group profiles · MITRE D3FEND · ISO/IEC 27037 · ACPO · RFC 3227 · CVSS v3.1</text>
