<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="430" fill="#0d1117"/>
  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">Cyber Range Design Portfolio</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#8b949e">A crisis tabletop series, a three-tier assessment programme and two training ranges</text>
  <rect x="30" y="90" width="157" height="112" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="108.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Crisis Tabletops</text>
  <text x="108.5" y="142" text-anchor="middle" font-size="11.5" fill="#8b949e">3 exercises · 3 days</text>
  <line x1="50" y1="156" x2="167" y2="156" stroke="#6e7681" stroke-width="1" opacity="0.5"/>
  <text x="108.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#8b949e">Lead the response</text>
  <rect x="211" y="90" width="157" height="112" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="289.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">SOC Assessment</text>
  <text x="289.5" y="142" text-anchor="middle" font-size="11.5" fill="#8b949e">3 tiers · ranked scoring</text>
  <line x1="231" y1="156" x2="348" y2="156" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
  <text x="289.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#3fb950">Measure the analyst</text>
  <rect x="392" y="90" width="157" height="112" rx="6" fill="#2b1d12" stroke="#d29922" stroke-width="1.5"/>
  <text x="470.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Adversary Emulation</text>
  <text x="470.5" y="142" text-anchor="middle" font-size="11.5" fill="#8b949e">3 campaigns · 67 missions</text>
  <line x1="412" y1="156" x2="529" y2="156" stroke="#d29922" stroke-width="1" opacity="0.5"/>
  <text x="470.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#d29922">Perform the intrusion</text>
  <rect x="573" y="90" width="157" height="112" rx="6" fill="#14202e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="651.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">DFIR and Detection</text>
  <text x="651.5" y="142" text-anchor="middle" font-size="11.5" fill="#8b949e">5 campaigns · 60 missions</text>
  <line x1="593" y1="156" x2="710" y2="156" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <text x="651.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#58a6ff">Investigate the evidence</text>
  <rect x="30" y="228" width="700" height="66" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6edf3">The same person designed all four</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#8b949e">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
  <rect x="30" y="312" width="700" height="86" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="380" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">Framework grounding</text>
  <text x="380" y="356" text-anchor="middle" font-size="11.5" fill="#8b949e">NIST SP 800-61r3 · NIST CSF 2.0 · ISO/IEC 27035 · ISO 22361 · DoD 8140 / DCWF · NICE · SFIA</text>
  <text x="380" y="376" text-anchor="middle" font-size="11.5" fill="#8b949e">MITRE D3FEND · MITRE ATT&amp;CK · ISO/IEC 27037 · ACPO · RFC 3227 · CVSS v3.1</text>
</svg>
