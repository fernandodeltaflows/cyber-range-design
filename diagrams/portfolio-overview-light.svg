  <text x="92.8" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">3 exercises · 3 days</text>
  <line x1="50.0" y1="156" x2="135.6" y2="156" stroke="#b0b0b0" stroke-width="1" opacity="0.5"/>
  <text x="92.8" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#57606a">Lead the response</text>
  <rect x="173.6" y="90" width="125.6" height="112" rx="6" fill="#f1edf7" stroke="#7a64a8" stroke-width="1.5"/>
