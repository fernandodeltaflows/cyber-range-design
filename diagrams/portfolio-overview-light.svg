  <text x="236.4" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">3 exercises · CTF</text>
  <line x1="193.6" y1="156" x2="279.2" y2="156" stroke="#7a64a8" stroke-width="1" opacity="0.5"/>
  <text x="236.4" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#7a64a8">Attack, then defend</text>
  <rect x="317.2" y="90" width="125.6" height="112" rx="6" fill="#e9f1ea" stroke="#5f8a62" stroke-width="1.5"/>
  <text x="380.0" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">SOC Assessment</text>
  <text x="380.0" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">3 tiers · ranked</text>
  <line x1="337.2" y1="156" x2="422.79999999999995" y2="156" stroke="#5f8a62" stroke-width="1" opacity="0.5"/>
  <text x="380.0" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#5f8a62">Measure the analyst</text>
  <rect x="460.8" y="90" width="125.6" height="112" rx="6" fill="#fdf0e6" stroke="#c98a4b" stroke-width="1.5"/>
  <text x="523.6" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Adversary Emulation</text>
  <text x="523.6" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">67 missions</text>
  <line x1="480.8" y1="156" x2="566.4" y2="156" stroke="#c98a4b" stroke-width="1" opacity="0.5"/>
  <text x="523.6" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#c98a4b">Perform the intrusion</text>
  <rect x="604.4" y="90" width="125.6" height="112" rx="6" fill="#eef2f7" stroke="#5b7a9e" stroke-width="1.5"/>
  <text x="667.2" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">DFIR and Detection</text>
  <text x="667.2" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">60 missions</text>
  <line x1="624.4" y1="156" x2="710.0" y2="156" stroke="#5b7a9e" stroke-width="1" opacity="0.5"/>
  <text x="667.2" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#5b7a9e">Find the evidence</text>
  <rect x="30" y="228" width="700" height="66" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">The same person designed all five</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#57606a">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
