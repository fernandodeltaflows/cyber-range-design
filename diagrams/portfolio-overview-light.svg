  <text x="236.0" y="164" text-anchor="middle" font-size="10" fill="#57606a">60 missions</text>
  <line x1="194" y1="178" x2="278" y2="178" stroke="#5b7a9e" stroke-width="1" opacity="0.5"/>
  <text x="236.0" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b7a9e">Find the evidence</text>
  <rect x="320" y="80" width="408" height="154" rx="8" fill="none" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="524.0" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#57606a">Other exercises I designed</text>
