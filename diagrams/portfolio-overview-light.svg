<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Cyber Range Design Portfolio</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">Two training ranges and a three-tier assessment programme</text>
  <rect x="30" y="90" width="200" height="112" rx="6" fill="#fdf0e6" stroke="#c98a4b" stroke-width="1.5"/>
  <text x="130" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Adversary Emulation</text>
  <text x="130" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">3 campaigns · 67 missions</text>
  <line x1="60" y1="156" x2="200" y2="156" stroke="#c98a4b" stroke-width="1" opacity="0.5"/>
  <text x="130" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c98a4b">Perform the intrusion</text>
  <rect x="280" y="90" width="200" height="112" rx="6" fill="#eef2f7" stroke="#5b7a9e" stroke-width="1.5"/>
  <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">DFIR and Detection</text>
  <text x="380" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">5 campaigns · 60 missions</text>
  <line x1="310" y1="156" x2="450" y2="156" stroke="#5b7a9e" stroke-width="1" opacity="0.5"/>
  <text x="380" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b7a9e">Investigate the evidence</text>
  <rect x="530" y="90" width="200" height="112" rx="6" fill="#e9f1ea" stroke="#5f8a62" stroke-width="1.5"/>
  <text x="630" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">SOC Assessment</text>
  <text x="630" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">3 tiers · ranked scoring</text>
  <line x1="560" y1="156" x2="700" y2="156" stroke="#5f8a62" stroke-width="1" opacity="0.5"/>
  <text x="630" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5f8a62">Measure the analyst</text>
  <path d="M 234 146 L 274 146" stroke="#9aa4b2" stroke-width="2"/>
  <path d="M 274 146 l -6 -5 l 0 10 z" fill="#9aa4b2"/>
  <path d="M 484 146 L 524 146" stroke="#9aa4b2" stroke-width="2"/>
  <path d="M 524 146 l -6 -5 l 0 10 z" fill="#9aa4b2"/>
  <rect x="30" y="228" width="700" height="66" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">The same person designed all three</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#57606a">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
  <rect x="30" y="312" width="700" height="56" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Framework grounding</text>
  <text x="380" y="354" text-anchor="middle" font-size="11.5" fill="#57606a">MITRE ATT&amp;CK · MITRE D3FEND · NIST SP 800-61 · ISO/IEC 27037 · ACPO · RFC 3227 · CVSS v3.1 · DoD 8140 / DCWF · NICE · SFIA</text>
</svg>
