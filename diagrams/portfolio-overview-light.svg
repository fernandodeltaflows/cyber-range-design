  <rect x="42" y="112" width="120" height="112" rx="6" fill="#e9f1ea" stroke="#5f8a62" stroke-width="1.5"/>
  <text x="102.0" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">SOC Assessment</text>
  <text x="102.0" y="164" text-anchor="middle" font-size="10" fill="#57606a">3 tiers · ranked</text>
  <line x1="60" y1="178" x2="144" y2="178" stroke="#5f8a62" stroke-width="1" opacity="0.5"/>
