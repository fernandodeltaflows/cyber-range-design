  <text x="658.0" y="164" text-anchor="middle" font-size="10" fill="#57606a">67 missions</text>
  <line x1="616" y1="178" x2="700" y2="178" stroke="#c98a4b" stroke-width="1" opacity="0.5"/>
  <text x="658.0" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c98a4b">Perform the intrusion</text>
  <rect x="30" y="256" width="700" height="66" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">The same person designed all five</text>
  <text x="380" y="302" text-anchor="middle" font-size="12" fill="#57606a">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
  <rect x="30" y="340" width="700" height="86" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
