  <text x="380" y="404" text-anchor="middle" font-size="11.5" fill="#57606a">MITRE ATT&amp;CK and group profiles · MITRE D3FEND · ISO/IEC 27037 · ACPO · RFC 3227 · CVSS v3.1</text>
