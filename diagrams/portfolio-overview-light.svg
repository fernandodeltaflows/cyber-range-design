  <line x1="348" y1="178" x2="432" y2="178" stroke="#b0b0b0" stroke-width="1" opacity="0.5"/>
  <text x="390.0" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57606a">Lead the response</text>
  <rect x="464" y="112" width="120" height="112" rx="6" fill="#f1edf7" stroke="#7a64a8" stroke-width="1.5"/>
  <text x="524.0" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Red vs Blue</text>
  <text x="524.0" y="164" text-anchor="middle" font-size="10" fill="#57606a">3 exercises · CTF</text>
  <line x1="482" y1="178" x2="566" y2="178" stroke="#7a64a8" stroke-width="1" opacity="0.5"/>
  <text x="524.0" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7a64a8">Attack, then defend</text>
  <rect x="598" y="112" width="120" height="112" rx="6" fill="#fdf0e6" stroke="#c98a4b" stroke-width="1.5"/>
