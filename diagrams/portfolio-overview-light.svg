<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Cyber Range Design Portfolio</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">A crisis tabletop series, a three-tier assessment programme and two training ranges</text>
  <rect x="30" y="90" width="157" height="112" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="108.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Crisis Tabletops</text>
  <text x="108.5" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">3 exercises · 3 days</text>
  <line x1="50" y1="156" x2="167" y2="156" stroke="#b0b0b0" stroke-width="1" opacity="0.5"/>
  <text x="108.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#57606a">Lead the response</text>
  <rect x="211" y="90" width="157" height="112" rx="6" fill="#e9f1ea" stroke="#5f8a62" stroke-width="1.5"/>
  <text x="289.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">SOC Assessment</text>
  <text x="289.5" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">3 tiers · ranked scoring</text>
  <line x1="231" y1="156" x2="348" y2="156" stroke="#5f8a62" stroke-width="1" opacity="0.5"/>
  <text x="289.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#5f8a62">Measure the analyst</text>
  <rect x="392" y="90" width="157" height="112" rx="6" fill="#fdf0e6" stroke="#c98a4b" stroke-width="1.5"/>
  <text x="470.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Adversary Emulation</text>
  <text x="470.5" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">3 campaigns · 67 missions</text>
  <line x1="412" y1="156" x2="529" y2="156" stroke="#c98a4b" stroke-width="1" opacity="0.5"/>
  <text x="470.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#c98a4b">Perform the intrusion</text>
  <rect x="573" y="90" width="157" height="112" rx="6" fill="#eef2f7" stroke="#5b7a9e" stroke-width="1.5"/>
  <text x="651.5" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">DFIR and Detection</text>
  <text x="651.5" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">5 campaigns · 60 missions</text>
  <line x1="593" y1="156" x2="710" y2="156" stroke="#5b7a9e" stroke-width="1" opacity="0.5"/>
  <text x="651.5" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#5b7a9e">Investigate the evidence</text>
  <rect x="30" y="228" width="700" height="66" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">The same person designed all four</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#57606a">A detection exercise is only honest if someone produced the telemetry it asks students to find</text>
  <rect x="30" y="312" width="700" height="86" rx="6" fill="#f5f5f5" stroke="#b0b0b0" stroke-width="1.5"/>
  <text x="380" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Framework grounding</text>
  <text x="380" y="356" text-anchor="middle" font-size="11.5" fill="#57606a">NIST SP 800-61r3 · NIST CSF 2.0 · ISO/IEC 27035 · ISO 22361 · DoD 8140 / DCWF · NICE · SFIA</text>
  <text x="380" y="376" text-anchor="middle" font-size="11.5" fill="#57606a">MITRE D3FEND · MITRE ATT&amp;CK · ISO/IEC 27037 · ACPO · RFC 3227 · CVSS v3.1</text>
</svg>
