<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cyber Range Build System Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a presenter's tour. Left, a mock-up of the real program window that changes as you click; right, the narration (who did what), the files created and the factory proof. Back and Next at the bottom. */
:root{
  --bg:#f6f8fa; --surface:#ffffff; --surface-2:#eef1f6; --fg:#17202e; --muted:#566072; --faint:#8793a2; --border:#d7dee7;
  --accent:#0d7a84; --accent-weak:#d6edef; --accent-fg:#0b5a62;
  --you:#1f5fae; --you-weak:#e3ecf8; --ai:#6b4fb3; --ai-weak:#ece7f7; --gate:#2f7d5b; --gate-weak:#e0f0e8;
  --sys:#566072; --sys-weak:#eceff3; --proof:#8f6417; --proof-weak:#f6eedb;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* The program's own look, kept light in both themes like a screenshot of the real app */
  --m-bg:#f6f7f9; --m-fg:#1d2330; --m-muted:#5d6677; --m-line:#d8dde6; --m-card:#ffffff; --m-accent:#1f5fae;
  --m-ok:#1d7a46; --m-warn:#a86400; --m-bad:#b3261e; --m-bar:#1d2330; --m-barfg:#ffffff; --m-warnbg:#fff7e6; --m-okbg:#e7f5ec; --m-badbg:#fbe9e7;
  --hot:#e8a317;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --surface:#141d27; --surface-2:#1a2430; --fg:#e7ecf3; --muted:#9aa6b5; --faint:#67727f; --border:#273340;
  --accent:#3fb6c2; --accent-weak:#10323a; --accent-fg:#6fd3dd;
  --you:#7fb0ef; --you-weak:#16263b; --ai:#b39ef0; --ai-weak:#241c3b; --gate:#5bbf90; --gate-weak:#132a22;
  --sys:#9aa6b5; --sys-weak:#1c2530; --proof:#d2a35a; --proof-weak:#2e2614; --hot:#f0b84a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d131b; --surface:#141d27; --surface-2:#1a2430; --fg:#e7ecf3; --muted:#9aa6b5; --faint:#67727f; --border:#273340;
  --accent:#3fb6c2; --accent-weak:#10323a; --accent-fg:#6fd3dd;
  --you:#7fb0ef; --you-weak:#16263b; --ai:#b39ef0; --ai-weak:#241c3b; --gate:#5bbf90; --gate-weak:#132a22;
  --sys:#9aa6b5; --sys-weak:#1c2530; --proof:#d2a35a; --proof-weak:#2e2614; --hot:#f0b84a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit}
/* One screen: header, the two panes, and the controls always in view; only the panes scroll, and the mock follows the action. */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 10px;max-width:1440px;margin:0 auto}
@media (max-width:980px),(max-height:560px){.app{height:auto;overflow:visible}}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:8px 4px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;min-width:0;flex:1 1 280px}
.brand .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-fg);font-weight:600}
.brand h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.005em;text-wrap:balance;order:-1}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--font-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:5px 12px;cursor:pointer}
.pill:hover{color:var(--fg);border-color:var(--faint)}
.pill:focus-visible,.navbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.pill{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;max-width:260px}

/* stage strip */
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;flex:0 0 auto}
.strip::-webkit-scrollbar{display:none}
.sbtn{flex:1 0 auto;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
.sbtn.on{color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.sbtn.done{color:var(--muted);border-color:var(--gate)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;flex:1 1 auto;min-height:0}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px),(max-height:560px){.main{flex:none}}

/* the mock window */
.win{background:var(--m-bg);color:var(--m-fg);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px -16px rgba(20,30,50,.35)}
.chrome{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#e9edf2;border-bottom:1px solid var(--m-line)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:5px;background:#c9d0d9;display:block}
.url{flex:1;min-width:0;font-family:var(--font-mono);font-size:12px;color:var(--m-muted);background:#fff;border:1px solid var(--m-line);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.local{font-family:var(--font-mono);font-size:10.5px;color:var(--m-ok);border:1px solid var(--m-ok);border-radius:4px;padding:1px 6px;white-space:nowrap}
.mock{flex:1;overflow:auto;font-size:14px;line-height:1.45;min-height:0;position:relative;scroll-behavior:smooth}
@media (max-width:980px),(max-height:560px){.mock{overflow:visible}}
.m .changed{animation:changed 1.6s ease both}
@keyframes changed{0%{box-shadow:0 0 0 3px rgba(232,163,23,.9)}100%{box-shadow:0 0 0 3px rgba(232,163,23,0)}}
.mbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:9px 16px;background:var(--m-bar);color:var(--m-barfg);font-size:13.5px}
.mbar b{font-weight:600}.mbar .tag{font-size:10.5px;background:var(--m-warn);padding:1px 6px;border-radius:3px;margin-left:4px;color:#fff}
.mbar nav{display:flex;flex-wrap:wrap;gap:12px;opacity:.85}.mbar .muser{margin-left:auto;font-size:12.5px;opacity:.85}
.mmain{padding:14px 16px 22px;max-width:980px}
.m h2{font-size:15.5px;margin:0 0 8px}.m h3{font-size:14.5px;margin:0 0 6px}
.m .muted{color:var(--m-muted)}.m .small{font-size:12.5px}.m .ok{color:var(--m-ok)}.m .warn{color:var(--m-warn)}.m .bad{color:var(--m-bad)}
.m .card{background:var(--m-card);border:1px solid var(--m-line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.m .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m .mbtn{font:inherit;font-size:13.5px;padding:5px 12px;border:1px solid var(--m-line);background:#fff;color:var(--m-fg);border-radius:4px;cursor:default}
.m .mbtn.primary{background:var(--m-accent);color:#fff;border-color:var(--m-accent);font-weight:600}
.m .mbtn.hold{color:var(--m-bad);border-color:var(--m-bad);font-weight:600}
.m .field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.m .field label{font-size:12.5px;color:var(--m-muted);font-weight:600}
.m .inp{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--m-line);border-radius:4px;background:#fff;color:var(--m-fg);min-height:31px;white-space:pre-wrap;overflow-wrap:anywhere}
.m .inp.area{min-height:52px}
.m .inp:empty::before{content:attr(data-ph);color:#a3abb8}
.m .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.m .warnbox{border-left:4px solid var(--m-warn);background:var(--m-warnbg);padding:8px 12px;margin:10px 0;border-radius:0 4px 4px 0}
.m .okbox{border-left:4px solid var(--m-ok);background:var(--m-okbg);padding:8px 12px;margin:10px 0;border-radius:0 4px 4px 0}
.m .badbox{border-left:4px solid var(--m-bad);background:var(--m-badbg);padding:8px 12px;margin:10px 0;border-radius:0 4px 4px 0}
.m table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.m th,.m td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--m-line);vertical-align:top}
.m th{font-size:12px;color:var(--m-muted);font-weight:600}
.m .tblwrap{overflow-x:auto}
.m code,.m .mono{font-family:var(--font-mono);font-size:12.5px}
.m ul.tight{margin:6px 0 0;padding-left:20px}
.m .pathbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:2px 0 0;min-width:460px}
.m .pstep{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px}
.m .pstep .pdot{width:24px!important;height:24px!important;font-size:11.5px!important}
.m .lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:8px;min-width:560px}
.m .lanehead{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--m-muted);padding:4px 2px;border-bottom:2px solid var(--m-line);grid-row:1}
.m .lc{background:#fff;border:1px solid var(--m-line);border-left-width:4px;border-radius:6px;padding:6px 9px;font-size:12.5px;line-height:1.4}
.m .lc.l1{border-left-color:#1f5fae}.m .lc.l2{border-left-color:#6b4fb3;border-style:dashed solid dashed solid}.m .lc.l3{border-left-color:#2f7d5b}
.m .lc b{display:block;font-size:11px;font-family:var(--font-mono);letter-spacing:.04em;color:var(--m-muted);font-weight:600}
.m .ptrack{display:flex;align-items:center;width:100%}
.m .seg{flex:1;height:4px;background:var(--m-line)}.m .seg.done{background:var(--m-ok)}.m .seg.none{background:transparent}
.m .pdot{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:600;border:2px solid var(--m-line);background:#fff;color:var(--m-muted);font-size:13px}
.m .pstep.approved .pdot{background:var(--m-ok);border-color:var(--m-ok);color:#fff}
.m .pstep.current .pdot{border-color:var(--m-accent);color:var(--m-accent)}
.m .pstep.current .pname{color:var(--m-accent);font-weight:600}
.m .stagecard{border:2px solid var(--m-accent);border-radius:8px;background:#fff;padding:12px 14px;margin-top:12px}
.m .stagehead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.m .runcard{border:1px solid var(--m-line);border-radius:6px;padding:8px 10px;margin:8px 0;background:#fbfbfd;font-size:13px}
.m .runcard .rhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.m .state{font-family:var(--font-mono);font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--m-line)}
.m .state.running{color:var(--m-accent);border-color:var(--m-accent)}
.m .state.done{color:var(--m-ok);border-color:var(--m-ok)}
.m .rsteps{margin:6px 0 0;padding-left:18px;color:var(--m-muted);font-size:12.5px}
.m .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--m-accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.m .decision{border:1px solid var(--m-line);border-radius:6px;padding:8px 10px;margin:8px 0;background:#fff}
.m .opt{font-size:13px;margin:2px 0}.m .opt.rec{color:var(--m-ok);font-weight:600}
.m .chk{display:inline-flex;width:16px;height:16px;border:1.5px solid #8a93a3;border-radius:3px;align-items:center;justify-content:center;font-size:12px;line-height:1;background:#fff;flex:0 0 auto}
.m .chk.on{background:var(--m-ok);border-color:var(--m-ok);color:#fff}
.m .chk.on::after{content:"✓"}
.m .tickrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--m-line)}
.m .lvl{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--m-line);white-space:nowrap}
.m .lvl.L1{color:var(--m-ok);border-color:var(--m-ok)}.m .lvl.L2{color:var(--m-accent);border-color:var(--m-accent)}.m .lvl.L2P{color:var(--m-accent);border-color:var(--m-accent);border-style:dashed;font-weight:600}
.m .lvl.MANUAL{color:var(--m-warn);border-color:var(--m-warn)}.m .lvl.CAPTURE{color:#6b4fb3;border-color:#6b4fb3}.m .lvl.CHECKPOINT{color:var(--m-bad);border-color:var(--m-bad)}
.m .hidden-val{font-family:var(--font-mono);background:#eceff3;color:var(--m-muted);padding:1px 6px;border-radius:3px}
.m .later{border:2px dashed #b7c0cc;border-radius:8px;padding:12px 14px;background:#fff;margin-top:12px}
.m .later li{margin:4px 0}
.m .flag{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:#f6eedb;color:#7a5612;border:1px solid #e3cf9f}
.m .toast{position:sticky;bottom:10px;margin:10px auto 0;max-width:460px;background:#1d2330;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:6px}
.m .fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.m .newfile{animation:flash 1.4s ease both}
@keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
.m .intro{padding:22px 20px}
.m .intro .big{font-size:20px;font-weight:600;margin:0 0 6px;text-wrap:balance}
.m .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.m .flow span{font-family:var(--font-mono);font-size:12.5px;background:#fff;border:1px solid var(--m-line);border-radius:5px;padding:5px 10px}
.m .flow b{color:var(--m-muted);font-weight:400}
.m .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.m .num{background:#fff;border:1px solid var(--m-line);border-radius:6px;padding:10px 12px}
.m .num .v{font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.m .num .l{font-size:12.5px;color:var(--m-muted)}
/* screen 1: the small ladder of lab depth by tier, centred at the bottom */
.m .ladder{display:grid;grid-template-columns:auto auto auto auto;justify-content:center;column-gap:22px;row-gap:3px;width:max-content;max-width:100%;margin:14px auto 0;padding:9px 18px 10px;background:#fff;border:1px solid var(--m-line);border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.m .ladder .lhd{grid-column:1/-1;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--m-muted);font-weight:600;margin-bottom:2px}
.m .ladder .lrow{display:contents}
.m .ladder .lrow b{font-family:var(--font-mono);font-size:12.5px;font-weight:600}
.m .ladder .lrow span{color:var(--m-muted);white-space:nowrap}
.m .ladder em{font-style:normal;font-family:var(--font-mono);font-weight:600;color:var(--m-fg);display:inline-block;min-width:2ch;text-align:right;margin-right:3px}
@media (max-width:560px){.m .ladder{column-gap:10px;padding:8px 10px;font-size:12px;overflow-x:auto}}
.m .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.m .col{background:#fff;border:1px solid var(--m-line);border-radius:6px;padding:12px 14px}
.m .col h3{font-size:13.5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-mono)}
.m .opts .col{padding:10px 12px}
.m .opts .col h3{margin-bottom:2px}
.m .ostat{font-family:var(--font-mono);font-size:11px;color:var(--m-muted);margin-bottom:4px}
.m .odef{margin:0 0 6px}
.m ul.pc{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.4}
.m ul.pc li{position:relative;padding-left:16px;margin:3px 0}
.m ul.pc li::before{position:absolute;left:0;top:0;font-family:var(--font-mono);font-weight:600}
.m ul.pc li.pro::before{content:"+";color:var(--m-ok)}
.m ul.pc li.con::before{content:"\2212";color:var(--m-bad)}
.m .col.built{border-top:4px solid var(--m-ok)}.m .col.proven{border-top:4px solid #c08a2b}.m .col.next{border-top:4px solid var(--m-accent)}

/* the solve-rounds loop: three players, one step at a time */
.m .loopwrap{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr) 46px minmax(0,1fr);align-items:stretch;margin:14px 0 10px;min-width:520px}
.m .lnode{border:2px solid var(--m-line);border-radius:10px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center;text-align:center;opacity:.55;transition:opacity .35s,box-shadow .35s,transform .35s}
.m .lnode .lname{font-weight:600;font-size:13.5px}
.m .lnode .lsub{font-size:11.5px;color:var(--m-muted)}
.m .lnode.build{border-color:#1f5fae}.m .lnode.you{border-color:#2f7d5b}.m .lnode.solver{border-color:#6b4fb3;border-style:dashed}
.m .lnode.on{opacity:1;transform:translateY(-2px)}
.m .lnode.build.on{box-shadow:0 0 0 4px rgba(31,95,174,.18);background:#eef4ff}
.m .lnode.you.on{box-shadow:0 0 0 4px rgba(47,125,91,.18);background:#eef8f2}
.m .lnode.solver.on{box-shadow:0 0 0 4px rgba(107,79,179,.18);background:#f4f0fc}
.m .larrow{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#b7c0cc}
.m .larrow.go{color:var(--m-fg);animation:fadein .4s ease both}
.m .nowcard{min-height:92px;border:1px solid var(--m-line);border-left:5px solid var(--m-accent);border-radius:8px;background:#fff;padding:10px 14px}
.m .nowcard.build{border-left-color:#1f5fae}.m .nowcard.you{border-left-color:#2f7d5b}.m .nowcard.solver{border-left-color:#6b4fb3}
.m .nowcard .nstep{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-muted)}
.m .nowcard .ntitle{font-size:16px;font-weight:600;margin:3px 0 4px}
.m .nowcard .ngate{display:inline-block;margin-left:6px;font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;border-radius:9px;background:#e0f0e8;color:#2f7d5b;vertical-align:2px}
.m .ldots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.m .ldots i{width:9px;height:9px;border-radius:5px;background:var(--m-line);display:block}
.m .ldots i.done{background:#8aa4c4}.m .ldots i.on{background:var(--m-accent)}
.m .roundbar{margin-top:10px;padding:8px 12px;border-radius:8px;background:#f6eedb;color:#7a5612;border:1px solid #e3cf9f;font-size:13.5px}

/* the hot spot: what to click next */
.hot{outline:3px solid var(--hot)!important;outline-offset:2px;border-radius:5px;cursor:pointer!important;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,23,.55)}50%{box-shadow:0 0 0 7px rgba(232,163,23,0)}}

/* diagram */
.diag{overflow-x:auto;background:#fff;border:1px solid var(--m-line);border-radius:6px;padding:8px;margin-top:10px}
.diag svg{display:block;min-width:620px;width:100%;height:auto}
.diag .lane{fill:#f4f6f9;stroke:#d8dde6}
.diag .box{fill:#ffffff;stroke:#9aa5b4;stroke-width:1.2}
.diag .boxk{fill:#eef4ff;stroke:#1f5fae;stroke-width:1.2}
.diag .boxp{fill:#f3f8f2;stroke:#2f7d5b;stroke-width:1.2}
.diag text{fill:#1d2330;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px}
.diag .lt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;fill:#5d6677}
.diag .note{font-size:10.5px;fill:#5d6677}
.diag .ln{stroke:#5d6677;stroke-width:1.4;fill:none}
.diag .dash{stroke-dasharray:4 4}
.diag .link{stroke-width:2.6;fill:none;transition:stroke .5s}
.diag .link.closed{stroke:#b3261e;stroke-dasharray:6 5}
.diag .link.open{stroke:#1d7a46}
.diag .gate{fill:#fff;stroke-width:2}
.diag .gate.closed{stroke:#b3261e}.diag .gate.open{stroke:#1d7a46}
.diag .gtxt{font-size:10.5px;font-weight:600}
.diag .gtxt.closed{fill:#b3261e}.diag .gtxt.open{fill:#1d7a46}
.diag .arrowhead{fill:#5d6677}

/* narration side */
.side{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:auto}
@media (max-width:980px),(max-height:560px){.side{overflow:visible}}
.log li.new{font-weight:500}
.who.admin{background:var(--proof-weak);color:var(--proof)}
.who.solver{background:var(--ai-weak);color:var(--ai);outline:1px dashed var(--ai);outline-offset:-1px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kicker{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-fg);font-weight:600}
.side h2{font-size:19px;font-weight:600;margin:3px 0 6px;text-wrap:balance;line-height:1.25}
.lead{color:var(--muted);font-size:14.5px;margin:0}
.badge-proven{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:10px;background:var(--proof-weak);color:var(--proof);border:1px solid color-mix(in srgb,var(--proof) 40%,transparent)}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45;animation:fadein .4s ease both}
.log li.old{opacity:.62}
.who{flex:0 0 auto;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:2px;white-space:nowrap}
.who.you{background:var(--you-weak);color:var(--you)}.who.ai{background:var(--ai-weak);color:var(--ai)}
.who.gate{background:var(--gate-weak);color:var(--gate)}.who.sys{background:var(--sys-weak);color:var(--sys)}
.who.proof{background:var(--proof-weak);color:var(--proof)}
.hint{margin-top:12px;font-size:13.5px;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:baseline}
.hint .k{font-family:var(--font-mono);font-size:11px;color:var(--hot);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.files h3,.proof h3{font-size:12px;font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);color:var(--fg);border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent-weak)}
.chip.factory{border-style:dashed}
.chip.graded::after{content:" · graded";color:var(--muted)}
.fileview{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.fileview .fname{font-family:var(--font-mono);font-size:13px;font-weight:600}
.fileview p{margin:4px 0 8px;font-size:14px;color:var(--fg)}
.fileview pre{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;background:var(--surface-2);color:var(--fg);border-radius:6px;padding:9px 11px;overflow-x:auto;white-space:pre}
.proof{border-color:color-mix(in srgb,var(--proof) 45%,var(--border));background:color-mix(in srgb,var(--proof-weak) 55%,var(--surface))}
.proof h3{color:var(--proof)}
.proof ul{margin:0;padding-left:18px;font-size:14px}
.proof li{margin:3px 0}
.proof .src{font-size:12px;color:var(--muted);margin-top:6px}
.more summary{cursor:pointer;font-size:13px;color:var(--accent-fg)}
.more p{font-size:13.5px;color:var(--muted);margin:6px 0 0}

/* bottom controls */
.ctrl{display:flex;align-items:center;gap:12px;padding-top:10px;flex:0 0 auto}

.navbtn{font-weight:600;font-size:14px;padding:9px 18px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg);cursor:pointer}

:root[data-theme="dark"] .navbtn.next{color:#0d131b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .navbtn.next{color:#0d131b}}
.navbtn:disabled{opacity:.45;cursor:default}
.progress{flex:1;display:flex;gap:4px;min-width:0}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--border);display:block}
.progress i.done{background:var(--accent)}.progress i.on{background:var(--hot)}
.counter{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--faint);padding-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
let FAST=false, BUSY=false;
const sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- the files the program writes (real names), with a short note and a minimal made-up preview ---------- */
const FILES={
 "Brief.md":{d:"The agreed goal: what the lab teaches, for whom, at what level, and the frameworks it maps to. Everything later is built from it.",
  p:"# DEMO-1 Brief\nTeach: triage a suspicious sign-in (who, what ran, where it called out)\nAudience: SOC Tier 1, entry level · Exercise · 45 min\nDifficulty target: 3 of 10 · Anti-AI ceiling: level 2\nFrameworks: DCWF 511 · NICE PD-WRL-001 · ATT&CK T1078, T1105, T1071.001"},
 "Open Items Register.md":{d:"Every open question and every decision, with who decided and when. Nothing is lost between sessions or between people.",
  p:"| ID   | Item                                   | Status  | Decided by       |\n| OI-1 | Log sources: Windows Security + Sysmon | Decided | Builder-approver |\n| OI-2 | One hint per mission, costs points     | Decided | Builder-approver |"},
 "Time Record.md":{d:"The date each gate was passed and the time worked, measured from the program's own records, never estimated.",
  p:"| Gate                   | Date   | Time worked |\n| Start (Brief approved) | 10 Nov | 0 h 25 m    |\n| Design approved        | 10 Nov | 1 h 10 m    |\n| Build done             | 10 Nov | 0 h 50 m    |\n(a row is added at each gate)"},
 "Evidence-Pack Spec.md":{d:"What evidence the lab must hold and where each piece lives: the machines, the logs, the normal activity and the adversary activity hidden in it.",
  p:"Hosts: WS-07 (Windows 11), SIEM-01 (Splunk), JUMP-01\nLogs: Windows Security 4624, Sysmon 1 and 3\nNormal activity: 14 days, about 200 sign-ins a day\nAdversary activity: 1 sign-in from 198.51.100.23,\n  then certutil.exe, then a call out to 203.0.113.45"},
 "Competency to Mission Map.md":{d:"Each mission tied to the skill it measures and to the frameworks, so every mark the student earns proves something named.",
  p:"M1 Who signed in?      NICE PD-WRL-001 · ATT&CK T1078     · D3FEND D3-UBA\nM2 What ran next?      NICE PD-WRL-001 · ATT&CK T1105     · D3FEND D3-PA\nM3 Where did it call?  NICE PD-WRL-001 · ATT&CK T1071.001 · D3FEND D3-NTA"},
 "Constraint Register.md":{d:"The promises the design makes, each with the check that proves it and the gate it must pass by. A gate is refused while a promise due there is open.",
  p:"| ID  | Promise                                        | Due by          | State |\n| C-1 | No mission answered from another's record      | Design approved | open  |\n| C-2 | The sign-in hides in normal volume (200 a day) | Build done      | open  |\n| C-3 | Every answer reachable as the student          | Build done      | open  |"},
 "Difficulty Deviation Ledger.md":{d:"The difficulty target, and every change made during the build logged with its effect, so the difficulty measured at testing can be explained.",
  p:"Target: 3 of 10 (Tier 1, entry level)\nWatch item: M3 should need the time window found in M2\n| # | Change                               | Effect       |\n| 1 | Normal sign-ins raised to 200 a day  | a bit harder |"},
 "workbook-spec.json":{d:"The missions as data: titles, text, options, hints and where each answer comes from. The program builds the workbook from it.",
  p:'{ "lab": "DEMO-1", "type": "Exercise",\n  "missions": [\n    { "id": "M1", "title": "Who signed in?", "answer": "(graded: hidden)" },\n    { "id": "M2", "title": "What ran next?", "answer": "(graded: hidden)" },\n    { "id": "M3", "title": "Where did it call out?", "answer": "(graded: hidden)" } ] }'},
 "DEMO-1 workbook.xlsm":{d:"The missions in the platform's import format, built from the spec and checked by the workbook checker before you can approve.",
  p:"Tabs: Campaign · Missions · Hints · Answers (graded: hidden)\nWorkbook checker: PASS"},
 "build-plan.json":{d:"Every build step in order, its level (runs alone, waits for your approval, or is yours by hand) and the exact commands it is allowed to send.",
  p:'{ "steps": [\n  { "id": "B0", "what": "Build-baseline check (read only)",   "level": "L1" },\n  { "id": "B1", "what": "Install Sysmon on WS-07",            "level": "L2" },\n  { "id": "B2", "what": "Create the lab accounts",            "level": "L2" },\n  { "id": "B3", "what": "Generate 14 days of normal sign-ins", "level": "L2" },\n  { "id": "B4", "what": "Add the suspicious sign-in",         "level": "L2P" }, ... ] }'},
 "provisioning-spec.json":{d:"The machines to launch on the platform: names, operating systems, networks, and which one is the jump box.",
  p:'{ "hosts": [\n  { "name": "JUMP-01", "role": "jump box", "external_address": true },\n  { "name": "WS-07",   "os": "Windows 11", "network": "lab" },\n  { "name": "SIEM-01", "app": "Splunk",     "network": "lab" } ] }'},
 "Provisioning Checklist.md":{d:"Your checklist for the platform's console. The program cannot see the console, so you launch the machines and tick each line.",
  p:"[ ] Launch JUMP-01 from the platform's console\n[ ] Launch WS-07 (Windows 11) on the lab network\n[ ] Launch SIEM-01 (Splunk) on the lab network\n[ ] Add the student account in the platform"},
 "files/02_create_accounts.ps1":{d:"A build script the AI wrote for step B2. It reads the lab's passwords from a staging file as data, so no password appears on a command line in the logs the student will search. The staging file is removed at the freeze.",
  p:"# B2 · Create the lab accounts on WS-07 (DEMO-1)\n# Passwords come from the staging file as data, never on a command line\n$accounts = Import-Csv 'C:/lab-staging/accounts.csv'\nforeach ($a in $accounts) {\n  New-LocalUser -Name $a.account -Password (ConvertTo-SecureString $a.value -AsPlainText -Force)\n}"},
 "files/03_seed_signins.ps1":{d:"The script for step B3: two weeks of ordinary sign-ins, so the suspicious one has to be found, not spotted.",
  p:"# B3 · 14 days of normal sign-ins on WS-07, about 200 a day\n# Ordinary users at ordinary hours: the haystack for mission 1\nparam([int]$Days = 14, [int]$PerDay = 200)\n..."},
 "DEMO-1 Lab Credentials.md":{d:"Every password made for this lab, and every default account the platform's image carries: its account, host, purpose and what happens to it before delivery. Graded: hidden, each Show in the History. A password the student uses or that belongs to the story is proposed by the AI and approved by you. Before the freeze each one is changed or disabled, proven by signing in, then searched for as the student.",
  p:"| Account  | Host    | Purpose | Changes before delivery |\n| j.ortega | WS-07   | build   | yes |\n| svc_seed | WS-07   | build   | yes |\n| admin    | SIEM-01 | image default | changed at B5a |\n| Administrator | WS-07 | image default | disabled before delivery |\n(values hidden; each change proven by signing in)", g:true},
 "Open Items Register.md · updated":{d:"A live document. The AI opens an item the moment something blocks the build, and closes it once the fix you approved has worked, with who decided and when.",
  p:"| OI-1 | Log sources: Windows Security + Sysmon         | Decided |\n| OI-2 | One hint per mission, costs points             | Decided |\n| OI-3 | The student's role cannot read network events  | Closed: read access added, approved by a.builder; M3 captured again |"},
 "Constraint Register.md · updated":{d:"Also live: each promise flips to PASS or FAIL with its proof as the build runs, and a gate stays refused while one due there is open.",
  p:"| C-1 | No mission answered from another's record | PASS (run 5) |\n| C-2 | The sign-in hides in normal volume        | PASS: 2,814 normal sign-ins over 14 days |\n| C-3 | Every answer reachable as the student     | FAIL, then PASS after OI-3's fix |"},
 "Captured Answers.md":{d:"Each answer as taken from the live lab, signed in as the student, never written by hand. Graded: hidden until you press Show, and each Show is logged.",
  p:"M1 captured as the student · 10 Nov 15:12 · value hidden\nM2 captured as the student · 10 Nov 15:13 · value hidden\nM3 captured as the student · 10 Nov 15:15 · value hidden (again, after OI-3's fix)", g:true},
 "SOLVE-LOG - DEMO-1.md":{d:"The solver's full record, written outside the Build System and brought back: what it searched, what it found, its answer, where it struggled, its comments on the lab and the difficulty it rates. It is assessed in full before any fix.",
  p:"M1 · searched sign-ins by source address · answer given · first try\nM2 · chose powershell.exe first, then corrected · 2 tries\nM3 · needed M2's time window to narrow the search\nRated difficulty: 3 of 10\nComment: the decoy in M2 reads fair; nothing gives M3 away", f:true},
 "Freeze record":{d:"In the factory today: the record that build tools, passwords and history were removed, and the student's view checked.",
  p:"Factory record (SOC III):\nBuild folders, build password, shell and browser history: removed\nBuild-time internet access: closed\nData matched the source exactly: 1,182,827 events", f:true},
 "Facilitator Guide":{d:"In the factory today: the guide for whoever runs the lab, generated at release. Its answer key never leaves the instructor's hands.",
  p:"Cover · Contents · Missions · Answer key (instructor only)", f:true}
};

/* ---------- small helpers for the mock ---------- */
const STAGES=["Brief","Design","Build","Testing","Release"];
function chrome(active, inner, who){
  return `<div class="mbar"><b>Cyber Range Build System</b><nav>${["Dashboard","Labs","History","Rules copy","Lessons"].map(n=>`<span${n===active?' style="text-decoration:underline"':''}>${n}</span>`).join("")}</nav><span class="muser">${who||"a.builder · Builder-approver"}</span></div><div class="mmain">${inner}</div>`;
}
function pathBar(approved){
  return `<div class="tblwrap"><div class="pathbar" id="pathbar">${STAGES.map((s,i)=>{
    const st=i<approved?"approved":i===approved?"current":"later";
    return `<div class="pstep ${st}" data-i="${i}"><div class="ptrack"><span class="seg ${i===0?'none':(i<=approved?'done':'')}"></span><span class="pdot">${st==="approved"?"✓":i+1}</span><span class="seg ${i===4?'none':(i<approved?'done':'')}"></span></div><span class="pname">${i+1} · ${s}</span><span class="small muted">${st==="approved"?"Approved":st==="current"?"Current":""}</span></div>`}).join("")}</div></div>`;
}
function setPath(n){const pb=$("#pathbar");if(pb)pb.outerHTML=pathBar(n);}
function labHead(approved, extra){
  return `<div class="row" style="justify-content:space-between"><div style="min-width:0"><h2 style="font-size:19px;margin:4px 0 0">DEMO-1: Suspicious sign-in</h2><span class="small muted">Exercise (made up) · difficulty target 3 · anti-AI ceiling level 2 · 45 min · rules v5 · Builder-approver a.builder</span></div><span class="mbtn hold">Put the lab build on hold</span></div>
  <div class="card" style="margin:8px 0 0;padding:8px 12px"><div class="row" style="justify-content:space-between"><b class="small">Lab path</b><span class="small muted">Stage ${Math.min(approved+1,5)} of 5 · approve each stage to move on</span></div>${pathBar(approved)}</div>${extra||""}`;
}
/* Flash what just changed. No automatic scrolling: the presenter scrolls when ready. */
function mark(el){
  if(typeof el==="string")el=$(el); if(!el||FAST)return;
  el.classList.remove("changed"); void el.offsetWidth; el.classList.add("changed");
}
async function typeInto(sel,text){
  const el=typeof sel==="string"?$(sel):sel; if(!el)return;
  if(FAST){el.textContent=text;return;}
  mark(el);
  el.textContent=""; const step=Math.max(1,Math.ceil(text.length/45));
  for(let i=0;i<text.length;i+=step){el.textContent=text.slice(0,i+step);await new Promise(r=>setTimeout(r,16));}
}
function reveal(sel){const el=$(sel);if(!el)return;el.hidden=false;if(!FAST){el.classList.remove("fadein");void el.offsetWidth;el.classList.add("fadein");mark(el);}}
function tick(sel){const el=$(sel);if(el){el.classList.add("on");mark(el.parentElement);}}
function setCell(sel,html,cls){const e=$(sel);if(!e)return;e.className=cls||"";e.innerHTML=html;mark(e.closest("tr")||e);}
async function run(sel,{kind,id,lines,cost,note}){
  const el=$(sel); if(!el)return;
  const head=s=>`<div class="rhead"><b>${kind} run ${id}</b><span class="state ${s}">${s==="running"?'<span class="spin"></span> Running':"Done"}</span><span class="small muted">cap about US$6 · you can stop it</span>${s==="done"?`<span class="small muted" style="margin-left:auto">US$${cost}</span>`:""}</div>`;
  el.hidden=false;
  if(FAST){el.innerHTML=head("done")+`<ol class="rsteps">${lines.map(l=>`<li>${l}</li>`).join("")}</ol>${note?`<div class="small" style="margin-top:4px">${note}</div>`:""}`;return;}
  el.innerHTML=head("running")+`<ol class="rsteps"></ol>`; el.classList.add("fadein"); mark(el);
  const ol=$("ol",el);
  for(const l of lines){await sleep(520);const li=document.createElement("li");li.textContent=l;li.className="fadein";ol.appendChild(li);}
  await sleep(450); el.innerHTML=head("done")+ol.outerHTML+(note?`<div class="small fadein" style="margin-top:4px">${note}</div>`:"");
}
function addProduced(names){
  const box=$("#produced"); if(box){box.hidden=false;const ul=$("ul",box);names.forEach(n=>{const li=document.createElement("li");li.innerHTML=`<span class="mono">${esc(n)}</span>${FILES[n]&&FILES[n].g?' <span class="warn small">(graded: hidden)</span>':''}${FILES[n]&&FILES[n].f?' <span class="flag">proven in the factory</span>':''}`;if(!FAST)li.className="newfile";ul.appendChild(li);});mark(box);}
  names.forEach(n=>{if(!CUR.files.includes(n))CUR.files.push(n);}); renderFiles(names[names.length-1]);
}
function toast(text){const m=$("#mock");const t=document.createElement("div");t.className="toast fadein";t.textContent=text;m.appendChild(t);if(!FAST)setTimeout(()=>t.remove(),3200);else t.remove();}

/* the solve-rounds loop: light one player, show one card, the previous one gone */
const LOOPWHO={build:"Cyber Range Build System",you:"Builder-approver",solver:"Solver workspace (outside)"};
function loopStep(n,who,a1,a2,title,text,gate){
  $$(".lnode").forEach(e=>e.classList.toggle("on",e.id==="n-"+who));
  [["#a1",a1],["#a2",a2]].forEach(([id,v])=>{const e=$(id);if(!e)return;e.classList.remove("go");e.firstElementChild.textContent=v||"";if(v&&!FAST){void e.offsetWidth;e.classList.add("go");}});
  const c=$("#nowcard"); if(c){c.className="nowcard "+who;
    c.innerHTML=`<div class="nstep">Step ${n} of 9 · ${LOOPWHO[who]}</div><div class="ntitle">${esc(title)}${gate?'<span class="ngate">your decision</span>':''}</div><div>${esc(text)}</div>`;
    if(!FAST){c.classList.remove("fadein");void c.offsetWidth;c.classList.add("fadein");}}
  $$("#ldots i").forEach((d,i)=>{d.className=i<n-1?"done":i===n-1?"on":"";});
}

/* ---------- the diagram: how the Build System connects to the platform ---------- */
function diagram(open){
  const c=open?"open":"closed";
  return `<div class="diag" id="diag"><svg viewBox="0 0 760 330" role="img" aria-label="How the Cyber Range Build System connects to the platform">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="lane" x="6" y="6" width="120" height="318" rx="8"/><text class="lt" x="20" y="26">YOU</text>
  <rect class="lane" x="138" y="6" width="370" height="318" rx="8"/><text class="lt" x="152" y="26">CYBER RANGE BUILD SYSTEM</text><text class="note" x="152" y="40">private, on your machine</text>

add({stage:-1,kicker:"Start",title:"What the Cyber Range Build System is",url:"",
 lead:"One person turns a learning goal into a tested cyber range lab, stage by stage. The AI does the heavy work; the person approves every gate.",
 html:()=>`<div class="intro"><p class="big">From a learning goal to a released lab, in five gated stages</p>
 <p class="muted">The method was built and proven in our factory, where lab campaigns are designed, built, tested and released on the platform. The Build System puts that method into screens: one Builder-approver drives a lab from brief to release, with the AI working inside fixed limits.</p>
 <div class="flow"><span>1 Brief</span><b>→</b><span>2 Design</span><b>→</b><span>3 Build</span><b>→</b><span>4 Testing</span><b>→</b><span>5 Release</span></div>
 <div class="nums">
  <div class="num"><div class="v">3 · 49</div><div class="l">SOC assessments and missions, live on the range in 8 weeks</div></div>
  <div class="num"><div class="v">5</div><div class="l">DFIR campaigns, first versions in 4 days, deployed and used</div></div>
  <div class="num"><div class="v">1 / 49</div><div class="l">questions an AI answered from the mission text alone</div></div>
  <div class="num"><div class="v">1.2M</div><div class="l">events of authored activity in one lab (SOC III)</div></div>
 </div>
 <p class="small muted" style="margin-top:14px">The tour follows one made-up lab, DEMO-1, a short SOC Tier 1 exercise. Click the highlighted control on each screen, or press Next. No AI is called: every name, address and answer is invented, and the addresses come from the ranges reserved for documentation.</p>
 <div class="ladder" aria-label="Lab depth by tier"><div class="lhd">Lab depth by tier</div>
  <div class="lrow"><b>SOC I</b><span><em>5</em> machines</span><span><em>1</em> network</span><span><em>5</em> emulated machines</span></div>
  <div class="lrow"><b>SOC II</b><span><em>7</em> machines</span><span><em>2</em> networks</span><span><em>27</em> emulated machines</span></div>
  <div class="lrow"><b>SOC III</b><span><em>12</em> machines</span><span><em>3</em> networks</span><span><em>28</em> emulated machines</span></div></div></div>`,
 beats:[],
 proof:{t:"Proven in the factory",l:["3 SOC assessments (49 missions) live in 8 weeks","5 DFIR campaigns, first versions in 4 days","Every graded answer captured from the running lab, never written by hand"],s:"Source: the factory's SOC III walkthrough and release records, 2026."},
 more:"The factory is where the method was worked out and proven, lab by lab. The Build System is the same method as a product: the same rules, the same gates, the same checks, in screens a team can use. In the depth ladder, machines are the virtual machines run on the range for each lab; emulated machines are the further hosts that appear in the lab's logs, generated as part of the authored activity, with no machine behind them."
});

add({stage:2,kicker:"Stage 3 · Build",title:"The build plan, its scripts, and the program's safety checks",url:"127.0.0.1:8800/labs/DEMO-1",
 lead:"The AI turns the design into exact build steps and writes the scripts each step runs. The program checks every step before the Builder-approver sees it.",
 html:()=>chrome("Labs",labHead(2,`<div class="stagecard"><div class="stagehead"><div><b>Stage 3 · Build</b> <span class="small" style="color:var(--m-accent)">current</span><div class="small muted">First the build plan, then provisioning, then the build steps through the lab tool.</div></div><span class="mbtn" id="startplan">Start the build plan</span></div>
  <div class="runcard" id="run6" hidden></div>
  <div class="card" id="produced" hidden style="margin:8px 0"><b>What this stage produced</b><ul class="tight"></ul></div>
  <div id="plan" hidden class="card" style="margin:8px 0"><h3>The build plan</h3><div class="tblwrap"><table id="plantbl"><tr><th>Step</th><th>What</th><th>Runs</th><th>Level</th></tr>
   <tr><td>B0</td><td>Build-baseline check of WS-07 and SIEM-01: Windows version, time zone, Splunk answering (read only)</td><td class="mono small">files/00_check.ps1</td><td><span class="lvl L1">L1</span></td></tr>
   <tr><td>B1</td><td>Install Sysmon on WS-07</td><td class="mono small">files/01_sysmon.ps1</td><td><span class="lvl L2">L2</span></td></tr>
   <tr><td>B2</td><td>Create the lab accounts (passwords made for this lab, in the credentials file)</td><td class="mono small">files/02_create_accounts.ps1</td><td><span class="lvl L2">L2</span></td></tr>
   <tr><td>B3</td><td>Generate 14 days of normal sign-ins</td><td class="mono small">files/03_seed_signins.ps1</td><td><span class="lvl L2">L2</span></td></tr>
   <tr><td>B4</td><td>Add the suspicious sign-in, the program run and the call out</td><td class="mono small">files/04_adversary.ps1</td><td><span class="lvl L2P">L2P</span></td></tr>
   <tr id="b5row"><td>B5</td><td>Forward the logs to SIEM-01, signing in with its admin login</td><td class="mono small">files/05_forward.sh</td><td><span class="lvl L2P">L2P</span></td></tr>
   <tr><td>C1-C3</td><td>Capture each answer, signed in as the student</td><td class="mono small">files/capture.ps1</td><td><span class="lvl CAPTURE">CAPTURE</span></td></tr></table></div>
   <p class="small muted" style="margin:6px 0 0">L1 reads only, runs with no click · L2 changes something, waits for your "Approve step" · L2P a group of steps you approve once · credentials always wait for your click</p></div>
  <div id="prob" hidden class="badbox"><b>Problems the program found (1)</b><div class="small" style="margin-top:4px">Step B5: <code>files/05_forward.sh</code> signs in to Splunk on SIEM-01 with the admin password the platform's image comes with. That password is the same on every lab built from the image, so it must never stay in a lab or be written in its files. The program knows it by its exact value and refuses the step. Fix: first change it to a password made for this lab.</div><div class="row" style="margin-top:6px"><span class="mbtn" id="fix">Needs fixing</span><span class="small muted">a fix is a plan re-run; or ask the AI for a different change in the stage's chat</span></div></div>
  <div id="notes" hidden class="card small" style="margin:8px 0"><b>Password notes (2), not a block</b><ul class="tight"><li>B2 sets lab passwords: from the credentials file; each changes before delivery</li><li>B5a sets SIEM-01's admin password: from the credentials file; changes before delivery</li></ul></div>
  <div class="runcard" id="run7" hidden></div>
  <div class="row" style="margin-top:10px"><span class="mbtn primary" id="approveplan" hidden>Approve the build plan</span></div></div>`)),
 beats:[
  {who:"you",say:"Starts the build plan.",target:"#startplan",hint:"Click Start the build plan",act:async()=>{}},
  {who:"ai",auto:true,say:"Writes the plan from the approved design: every step, its level, the script each step runs, and the lab's passwords in a graded credentials file.",
   act:async()=>{await run("#run6",{kind:"Build plan",id:6,cost:"2.31",lines:["Read the approved design","Wrote 6 build steps and 3 capture steps","Wrote the script each step runs","Made the lab's passwords and wrote them in the credentials file","Wrote the provisioning spec and checklist"]});addProduced(["build-plan.json","files/02_create_accounts.ps1","files/03_seed_signins.ps1","DEMO-1 Lab Credentials.md","provisioning-spec.json","Provisioning Checklist.md"]);reveal("#plan");}},
  {who:"sys",auto:true,say:"The program checks every step and every script before you see them. One is refused: B5 would sign in to Splunk with the admin password the platform's image comes with, the same on every lab. The program knows that exact password and refuses the step.",act:async()=>{$("#b5row").style.background="#fbe9e7";mark("#b5row");await sleep(900);reveal("#prob");}},
  {who:"you",say:"Marks it \"Needs fixing\". The plan is made again: a new step first changes SIEM-01's admin login to a password made for this lab.",target:"#fix",hint:"Click Needs fixing",
   act:async()=>{await run("#run7",{kind:"Build plan",id:7,cost:"0.88",lines:["Re-made the plan from the design","Added B5a: change SIEM-01's admin login first (credentials file)"]});
    const r=$("#b5row");r.style.background="";r.outerHTML=`<tr id="b5row" class="fadein"><td>B5a</td><td>Change SIEM-01's admin login to a lab password (credentials file)</td><td class="mono small">files/05a_admin.sh</td><td><span class="lvl L2P">L2P</span></td></tr><tr class="fadein"><td>B5</td><td>Forward the logs to SIEM-01</td><td class="mono small">files/05_forward.sh</td><td><span class="lvl L2P">L2P</span></td></tr>`;mark("#b5row");await sleep(900);
    $("#prob").outerHTML=`<div class="okbox small fadein">Problems the program found: 0</div>`;reveal("#notes");reveal("#approveplan");}},
  {who:"gate",say:"Approves the build plan. Nothing has touched the platform yet.",target:"#approveplan",hint:"Click Approve the build plan",act:async()=>{toast("Build plan approved · written to the History");}}
 ],
 more:"The read-only commands and the hold on risky steps are checked exactly: a command that cannot be proven safe is refused, never guessed at. Passwords follow the factory: the AI may create the lab's accounts; a platform's default login is refused by its exact value; and before delivery every build password is changed and searched for as the student.",
 proof:{t:"Proven in the factory · SOC III",l:["About 130 numbered build scripts, run in order","The same inputs rebuild the same lab","Every platform default password changed before delivery: Splunk's admin password and token changed in all five places on the host, then a scan found no copy of the defaults left"],s:"Source: SOC III build folder and build run-log, 2026."}
});

/* ---------- engine ---------- */
let si=0, bi=0, CUR={files:[],shown:null};
const mock=$("#mock"), side=$("#side");
const STAGE_LABEL=["Brief","Design","Build","Testing","Release"];
const WHO={you:"Builder-approver",ai:"AI",gate:"Human gate",sys:"The program",solver:"AI solver, outside",admin:"Admin"};

function buildChrome(){
  $("#jump").innerHTML=STEPS.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}</option>`).join("");
  $("#prog").innerHTML=STEPS.map(()=>"<i></i>").join("");
}
function renderFiles(showName){
  const box=$("#filesbox"); if(!box)return;
  if(!CUR.files.length){box.hidden=true;return;}
  box.hidden=false;
  if(showName)CUR.shown=showName;
  $(".chips",box).innerHTML=CUR.files.map(n=>{const f=FILES[n]||{};return `<button type="button" class="chip${f.f?' factory':''}${f.g?' graded':''}${n===CUR.shown?' on':''}" data-file="${esc(n)}">${esc(n)}</button>`}).join("");
  const v=$(".fileview",box), f=FILES[CUR.shown];
  if(f){v.hidden=false;v.innerHTML=`<div class="fname">${esc(CUR.shown)}${f.f?' <span class="badge-proven" style="margin:0 0 0 6px">factory</span>':''}</div><p>${esc(f.d)}</p><pre>${esc(f.p)}</pre>`;}else v.hidden=true;
}
function renderSide(){
  const s=STEPS[si];
  const done=s.beats.slice(0,bi);
  const nb=s.beats[bi];
  let hint;
  const last=s.beats[s.beats.length-1];
  if(nb&&!nb.auto) hint=nb.hint||"Click the highlighted control";
  else if(nb&&nb.auto) hint="Click Next";
  else if(last&&last.auto&&last.target) hint=last.hint;
  else hint= si<STEPS.length-1?"Click Next for the next screen":"End of the tour. Next starts it again.";
  const rev=done.slice().reverse();
  side.innerHTML=`<div class="panel"><span class="kicker">${esc(s.kicker)}</span><h2>${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p>${s.proven?'<span class="badge-proven">Proven in the factory · moving into the program next</span>':''}
   <div class="hint"><span class="k">Next</span><span>${esc(hint)}</span></div>
   <ul class="log">${rev.map((b,i)=>`<li class="${i===0?'new':'old'}"><span class="who ${b.who}">${WHO[b.who]}</span><span>${esc(b.say)}</span></li>`).join("")}</ul>
   ${si===1&&bi===0?`<div class="legend"><span class="who you">Builder-approver</span><span class="who ai">AI</span><span class="who gate">Human gate</span><span class="who sys">The program</span></div>`:""}</div>
   <div class="panel files" id="filesbox" hidden><h3>Files created here</h3><div class="chips"></div><div class="fileview" hidden></div></div>
   ${s.proof?`<div class="panel proof"><h3>${esc(s.proof.t)}</h3><ul>${s.proof.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="src">${esc(s.proof.s)}</div></div>`:""}
   ${s.more?`<details class="panel more"><summary>More detail</summary><p>${esc(s.more)}</p></details>`:""}`;
  renderFiles();
}
function setHot(){
  $$(".hot",mock).forEach(e=>e.classList.remove("hot"));
  const s=STEPS[si], nb=s.beats[bi];
  let sel=null;
  if(nb&&!nb.auto)sel=nb.target;
  else if(!nb){const last=s.beats[s.beats.length-1]; if(last&&last.target&&last.auto)sel=last.target; else if(last&&last.advance)sel=last.target;}
  if(sel){const el=$(sel,mock); if(el)el.classList.add("hot");}
  side.scrollTop=0;
}
function renderChrome(){
  const s=STEPS[si];
  $("#url").textContent=s.url||"Cyber Range Build System";
  $("#jump").value=String(si);
  $$("#prog i").forEach((e,i)=>{e.className=i<si?"done":i===si?"on":"";});
  $("#count").textContent=`${si+1} / ${STEPS.length}`;
  $("#strip").innerHTML=STAGE_LABEL.map((n,i)=>`<span class="sbtn${s.stage===i?' on':(s.stage>i?' done':'')}">${i+1} ${n}</span>`).join("");
  $("#back").disabled=si===0&&bi===0;
  $("#next").textContent=(si===STEPS.length-1&&bi>=s.beats.length)?"Restart":"Next";
}
let LAST_SI=null;
async function enter(i,upto){
  const prevStage=LAST_SI==null?null:STEPS[LAST_SI].stage; LAST_SI=i;
  si=i; CUR={files:[],shown:null};
  const s=STEPS[si];
  mock.innerHTML=s.html(); mock.scrollTop=0; mock.classList.remove("fadein");
  bi=0; renderChrome(); renderSide();
  const target=upto==null?0:upto;
  if(target>0){FAST=true; for(let k=0;k<target;k++){await s.beats[k].act();} FAST=false; bi=target;}
  renderChrome(); renderSide(); setHot();
  const card=STEPS[si].stage===prevStage?mock.querySelector(".stagecard, .later"):null;
  if(card&&mock.scrollHeight>mock.clientHeight+2){mock.style.scrollBehavior="auto";mock.scrollTop=Math.max(0,card.getBoundingClientRect().top-mock.getBoundingClientRect().top+mock.scrollTop-8);mock.style.scrollBehavior="";}
  if(upto==null) await autoRun();
}
async function autoRun(){
  const s=STEPS[si];
  while(bi<s.beats.length&&s.beats[bi].auto){BUSY=true;renderSide();await s.beats[bi].act();bi++;renderSide();renderChrome();setHot();}
  BUSY=false;
}
async function next(){
  if(BUSY)return;
  const s=STEPS[si];
  if(bi<s.beats.length){
    BUSY=true; const b=s.beats[bi];
    $$(".hot",mock).forEach(e=>e.classList.remove("hot"));
    await b.act(); bi++; renderSide(); renderChrome();
    if(b.advance&&bi>=s.beats.length){BUSY=false; return go(si+1);}
    setHot(); await autoRun(); BUSY=false; return;
  }
  if(si<STEPS.length-1) return go(si+1);
  return go(0);
}
async function go(i){ if(i<0||i>=STEPS.length)return; BUSY=true; await enter(i); BUSY=false; }
async function back(){
  if(BUSY)return;
  if(bi>0){
    // step back one action: replay the step up to the previous user action
    const s=STEPS[si]; let k=bi-1; while(k>0&&s.beats[k].auto)k--;
    BUSY=true; await enter(si,k); BUSY=false; return;
  }
  if(si>0){const p=STEPS[si-1]; BUSY=true; await enter(si-1,p.beats.length); BUSY=false;}
}
mock.addEventListener("click",e=>{const h=e.target.closest(".hot"); if(h){e.preventDefault(); next();}});
side.addEventListener("click",e=>{const c=e.target.closest(".chip"); if(c){CUR.shown=c.dataset.file; renderFiles();}});
$("#next").addEventListener("click",next);
$("#back").addEventListener("click",back);
$("#restart").addEventListener("click",()=>go(0));
$("#jump").addEventListener("change",e=>go(+e.target.value));
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("select,input,textarea"))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();back();}
});
$("#fs").addEventListener("click",()=>{
  const d=document;
  try{ if(d.fullscreenElement){d.exitFullscreen().catch(()=>{});} else if(d.documentElement.requestFullscreen){d.documentElement.requestFullscreen().catch(()=>{});} }catch(_){}
});
document.addEventListener("fullscreenchange",()=>{$("#fs").textContent=document.fullscreenElement?"Exit full screen":"Full screen";});
$("#theme").addEventListener("click",()=>{
  const r=document.documentElement, cur=r.getAttribute("data-theme");
  const sysDark=matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark=cur?cur==="dark":sysDark;
  r.setAttribute("data-theme",isDark?"light":"dark");
  try{localStorage.setItem("tour-theme",r.getAttribute("data-theme"));}catch(_){}
});
try{const t=localStorage.getItem("tour-theme"); if(t)document.documentElement.setAttribute("data-theme",t);}catch(_){}
buildChrome(); go(0);
})();
</script>
